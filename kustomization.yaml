apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jupyter-poc
resources:
  - deploy/base
  - deploy/platform-poc
configMapGenerator:
  - name: uem-collector-source
    files:
      - app.py=src/uem-collector/app.py
      - requirements.txt=src/uem-collector/requirements.txt
  - name: mock-oidc-source
    files:
      - app.py=src/mock-oidc/app.py
      - requirements.txt=src/mock-oidc/requirements.txt
  - name: jupyter-server-poc-telemetry
    files:
      - poc_telemetry.py=src/extensions/jupyter-server-poc-telemetry/poc_telemetry.py
      - poc-telemetry.json=src/extensions/jupyter-server-poc-telemetry/poc-telemetry.json
  - name: jupyterlab-poc-uem
    files:
      - package.json=src/extensions/jupyterlab-poc-uem/labextension/package.json
      - remoteEntry.js=src/extensions/jupyterlab-poc-uem/labextension/static/remoteEntry.6bea3d32b738d7a2be04.js
      - chunk.js=src/extensions/jupyterlab-poc-uem/labextension/static/509.4897d7b1e6821985f4d8.js
      - style.js=src/extensions/jupyterlab-poc-uem/labextension/static/style.js
      - third-party-licenses.json=src/extensions/jupyterlab-poc-uem/labextension/static/third-party-licenses.json
  - name: native-proxy-config
    files:
      - proxysql.cnf=src/native-proxies/proxysql.cnf
      - haproxy.cfg=src/native-proxies/haproxy.cfg
      - nginx.conf=src/native-proxies/nginx.conf
      - pgbouncer.ini=src/native-proxies/pgbouncer.ini
      - userlist.txt=src/native-proxies/userlist.txt
generatorOptions:
  disableNameSuffixHash: true
