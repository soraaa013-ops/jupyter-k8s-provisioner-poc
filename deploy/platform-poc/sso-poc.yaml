apiVersion: apps/v1
kind: Deployment
metadata: {name: mock-oidc}
spec:
  replicas: 1
  selector: {matchLabels: {app: mock-oidc}}
  template:
    metadata: {labels: {app: mock-oidc, component: sso-poc}}
    spec:
      containers:
        - name: oidc
          image: python:3.11-slim
          command: [sh, -ec]
          args:
            - |
              pip install --no-cache-dir --index-url=http://mirrors.tencentyun.com/pypi/simple --trusted-host=mirrors.tencentyun.com -r /app/requirements.txt
              exec uvicorn app:app --app-dir /app --host 0.0.0.0 --port 8080
          env:
            - {name: OIDC_ISSUER, value: "http://mock-oidc.jupyter-poc.svc:8080/jupyter"}
            - name: OIDC_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: mock-database-credentials, key: gateway-token}}
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe: {httpGet: {path: /isalive, port: http}, initialDelaySeconds: 5, periodSeconds: 5}
          volumeMounts: [{name: source, mountPath: /app, readOnly: true}]
      volumes: [{name: source, configMap: {name: mock-oidc-source}}]
---
apiVersion: v1
kind: Service
metadata: {name: mock-oidc}
spec: {selector: {app: mock-oidc}, ports: [{name: http, port: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: jupyterhub-poc}
spec:
  replicas: 1
  selector: {matchLabels: {app: jupyterhub-poc}}
  template:
    metadata: {labels: {app: jupyterhub-poc, component: sso-poc}}
    spec:
      containers:
        - name: hub
          image: jupyterhub/jupyterhub:5.3
          command: [sh, -ec]
          args:
            - |
              pip install --no-cache-dir --index-url=http://mirrors.tencentyun.com/pypi/simple --trusted-host=mirrors.tencentyun.com oauthenticator==17.1.0
              exec jupyterhub -f /etc/jupyterhub/jupyterhub_config.py
          env:
            - {name: OAUTH_CLIENT_ID, value: jupyter-poc}
            - name: OAUTH_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: mock-database-credentials, key: gateway-token}}
          ports: [{name: http, containerPort: 8000}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe: {httpGet: {path: /hub/health, port: http}, initialDelaySeconds: 10, periodSeconds: 5, failureThreshold: 60}
          volumeMounts: [{name: config, mountPath: /etc/jupyterhub, readOnly: true}]
      volumes: [{name: config, configMap: {name: jupyterhub-poc-config}}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: jupyterhub-poc-config}
data:
  jupyterhub_config.py: |
    import os
    c.JupyterHub.authenticator_class = "generic-oauth"
    c.GenericOAuthenticator.client_id = os.environ["OAUTH_CLIENT_ID"]
    c.GenericOAuthenticator.client_secret = os.environ["OAUTH_CLIENT_SECRET"]
    c.GenericOAuthenticator.authorize_url = "http://mock-oidc.jupyter-poc.svc:8080/jupyter/authorize"
    c.GenericOAuthenticator.token_url = "http://mock-oidc:8080/jupyter/token"
    c.GenericOAuthenticator.userdata_url = "http://mock-oidc:8080/jupyter/userinfo"
    c.GenericOAuthenticator.username_claim = "sub"
    c.GenericOAuthenticator.scope = ["openid", "profile"]
    c.GenericOAuthenticator.oauth_callback_url = "http://jupyterhub-poc:8000/hub/oauth_callback"
    c.GenericOAuthenticator.allow_all = True
    c.JupyterHub.bind_url = "http://0.0.0.0:8000"
    c.JupyterHub.cookie_secret = bytes.fromhex("0123456789abcdef" * 4)
    c.JupyterHub.log_level = "DEBUG"
---
apiVersion: v1
kind: Service
metadata: {name: jupyterhub-poc}
spec: {selector: {app: jupyterhub-poc}, ports: [{name: http, port: 8000}]}
