apiVersion: v1
kind: Secret
metadata:
  name: mock-database-credentials
  labels: {poc.openai.com/mock-only: "true"}
type: Opaque
stringData:
  postgres-password: mock-postgres-password
  mysql-root-password: mock-mysql-root-password
  mysql-password: mock-mysql-password
  mongo-root-password: mock-mongo-password
  gateway-token: mock-kernel-session-token
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mock-postgres}
spec:
  replicas: 1
  selector: {matchLabels: {app: mock-postgres}}
  template:
    metadata: {labels: {app: mock-postgres, component: mock-database}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: poc}
            - {name: POSTGRES_USER, value: gateway}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: mock-database-credentials, key: postgres-password}}
          ports: [{name: postgres, containerPort: 5432}]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe: {tcpSocket: {port: postgres}, initialDelaySeconds: 3, periodSeconds: 3}
---
apiVersion: v1
kind: Service
metadata: {name: mock-postgres}
spec: {selector: {app: mock-postgres}, ports: [{name: postgres, port: 5432}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mock-mysql}
spec:
  replicas: 1
  selector: {matchLabels: {app: mock-mysql}}
  template:
    metadata: {labels: {app: mock-mysql, component: mock-database}}
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          args: ["--mysql-native-password=ON"]
          env:
            - {name: MYSQL_DATABASE, value: poc}
            - {name: MYSQL_USER, value: gateway}
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: mock-database-credentials, key: mysql-password}}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: mock-database-credentials, key: mysql-root-password}}
          ports: [{name: mysql, containerPort: 3306}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 750m, memory: 768Mi}
          readinessProbe: {tcpSocket: {port: mysql}, initialDelaySeconds: 10, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: mock-mysql}
spec: {selector: {app: mock-mysql}, ports: [{name: mysql, port: 3306}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mock-mongo}
spec:
  replicas: 1
  selector: {matchLabels: {app: mock-mongo}}
  template:
    metadata: {labels: {app: mock-mongo, component: mock-database}}
    spec:
      containers:
        - name: mongo
          image: mongo:7
          env:
            - {name: MONGO_INITDB_ROOT_USERNAME, value: root}
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: mock-database-credentials, key: mongo-root-password}}
          ports: [{name: mongo, containerPort: 27017}]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe: {tcpSocket: {port: mongo}, initialDelaySeconds: 5, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: mock-mongo}
spec: {selector: {app: mock-mongo}, ports: [{name: mongo, port: 27017}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mock-elasticsearch}
spec:
  replicas: 1
  selector: {matchLabels: {app: mock-elasticsearch}}
  template:
    metadata: {labels: {app: mock-elasticsearch, component: mock-database}}
    spec:
      containers:
        - name: elasticsearch
          image: elasticsearch:8.15.5
          env:
            - {name: discovery.type, value: single-node}
            - {name: xpack.security.enabled, value: "false"}
            - {name: xpack.ml.enabled, value: "false"}
            - {name: ES_JAVA_OPTS, value: "-Xms384m -Xmx384m"}
          ports: [{name: http, containerPort: 9200}]
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe: {httpGet: {path: /, port: http}, initialDelaySeconds: 15, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: mock-elasticsearch}
spec: {selector: {app: mock-elasticsearch}, ports: [{name: http, port: 9200}]}
