apiVersion: apps/v1
kind: Deployment
metadata: {name: uem-collector}
spec:
  replicas: 1
  selector: {matchLabels: {app: uem-collector}}
  template:
    metadata: {labels: {app: uem-collector, component: uem-collector}}
    spec:
      containers:
        - name: collector
          image: python:3.11-slim
          command: ["sh", "-ec"]
          args:
            - |
              pip install --no-cache-dir --index-url=http://mirrors.tencentyun.com/pypi/simple --trusted-host=mirrors.tencentyun.com -r /app/requirements.txt
              exec uvicorn app:app --app-dir /app --host 0.0.0.0 --port 8080
          env:
            - name: UEM_API_TOKEN
              valueFrom: {secretKeyRef: {name: mock-database-credentials, key: gateway-token}}
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 5, failureThreshold: 60}
          volumeMounts: [{name: source, mountPath: /app, readOnly: true}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
      volumes: [{name: source, configMap: {name: uem-collector-source}}]
---
apiVersion: v1
kind: Service
metadata: {name: uem-collector}
spec:
  selector: {app: uem-collector}
  ports: [{name: http, port: 8080, targetPort: http}]
