apiVersion: apps/v1
kind: Deployment
metadata: {name: data-gateway}
spec:
  replicas: 1
  selector: {matchLabels: {app: data-gateway}}
  template:
    metadata: {labels: {app: data-gateway, component: data-gateway}}
    spec:
      containers:
        - name: gateway
          image: python:3.11-slim
          command: ["sh", "-ec"]
          args:
            - |
              pip install --no-cache-dir --index-url=http://mirrors.tencentyun.com/pypi/simple --trusted-host=mirrors.tencentyun.com -r /app/requirements.txt
              exec uvicorn app:app --app-dir /app --host 0.0.0.0 --port 8080
          env:
            - name: GATEWAY_API_TOKEN
              valueFrom: {secretKeyRef: {name: mock-database-credentials, key: gateway-token}}
            - {name: POSTGRES_HOST, value: mock-postgres}
            - {name: POSTGRES_DATABASE, value: poc}
            - {name: POSTGRES_USER, value: gateway}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: mock-database-credentials, key: postgres-password}}
            - {name: MYSQL_HOST, value: mock-mysql}
            - {name: MYSQL_USER, value: gateway}
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: mock-database-credentials, key: mysql-password}}
            - {name: MYSQL_DATABASE, value: poc}
            - {name: MONGO_HOST, value: mock-mongo}
            - {name: MONGO_USER, value: root}
            - name: MONGO_PASSWORD
              valueFrom: {secretKeyRef: {name: mock-database-credentials, key: mongo-root-password}}
            - {name: MONGO_DATABASE, value: poc}
            - {name: ELASTIC_URL, value: http://mock-elasticsearch:9200}
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 5, failureThreshold: 60}
          volumeMounts: [{name: source, mountPath: /app, readOnly: true}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
      volumes: [{name: source, configMap: {name: data-gateway-source}}]
---
apiVersion: v1
kind: Service
metadata: {name: data-gateway}
spec:
  selector: {app: data-gateway}
  ports: [{name: http, port: 8080, targetPort: http}]
