apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: kernel-to-data-gateway}
spec:
  podSelector: {matchLabels: {component: kernel}}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {component: data-gateway}}}]
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: mock-databases-only-from-gateway}
spec:
  podSelector: {matchLabels: {component: mock-database}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {component: data-gateway}}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: data-gateway-ingress-egress}
spec:
  podSelector: {matchLabels: {component: data-gateway}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - {podSelector: {matchLabels: {component: kernel}}}
        - {podSelector: {matchLabels: {component: jupyterlab}}}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to: [{podSelector: {matchLabels: {component: mock-database}}}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
