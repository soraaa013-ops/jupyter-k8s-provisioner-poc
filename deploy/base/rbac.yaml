apiVersion: v1
kind: ServiceAccount
metadata:
  name: jupyterlab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jupyterlab-kernel-provisioner
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jupyterlab-kernel-provisioner
subjects:
  - kind: ServiceAccount
    name: jupyterlab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jupyterlab-kernel-provisioner

