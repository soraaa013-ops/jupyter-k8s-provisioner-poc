[databases]
poc = host=mock-postgres port=5432 dbname=poc

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = session
max_client_conn = 100
default_pool_size = 20
server_connect_timeout = 3
query_timeout = 10
pidfile = /tmp/pgbouncer.pid
logfile =
